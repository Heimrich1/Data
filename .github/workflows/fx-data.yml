name: FX-Daten (Dukascopy M1/H1)

# Lädt Bid/Ask-Kerzen von Dukascopy und legt je Symbol, Zeitrahmen und Jahr
# eine Parquet-Datei im Release "fx-data" ab.
#
# Dukascopy drosselt GitHub-Rechner insgesamt auf etwa 0,4 Dateien/s; mehr
# parallele Jobs bringen nichts, sondern nur Timeouts (am 2026-10-20 gemessen:
# 16 Jobs zusammen ~0,37 Dateien/s). Jeder Lauf plant deshalb die noch
# fehlenden Einträge (zuerst H1, dann M1 vom neuesten Jahr rückwärts),
# verteilt sie auf 4 Jobs mit je ~5 h Budget und lädt
# jede fertige Jahresdatei sofort hoch. Erneut starten setzt fort, wo der
# letzte Lauf aufgehört hat. Ein Job schafft ~0,06 Dateien/s, also ein volles
# M1-Jahr in ~3 h; ein Lauf dauert deshalb meist nur ~3 h.
#
# Läuft stündlich (ein Lauf, der noch läuft, lässt den nächsten warten; so
# beginnt nach einem ~3-h-Lauf der nächste spätestens 1 h später; zusätzlich
# stößt jeder erfolgreiche Lauf den nächsten selbst an, Job „next“),
# bis alles geladen ist; danach wird nur noch das
# laufende Jahr wöchentlich erneuert (Planer überspringt Fertiges).
# Actions-Minuten sind kostenlos, solange das Repo öffentlich ist. Wird es
# privat gestellt, den Zeitplan unten vorher entfernen!

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbole, komma-getrennt (leer = alle)"
        required: false
        default: ""
      tfs:
        description: "Zeitrahmen: h1,m1 / h1 / m1"
        required: false
        default: "h1,m1"
      years:
        description: "Nur diese Jahre, z. B. 2025 oder 2003-2010 (leer = vorübergehend 2013-2026)"
        required: false
        default: ""
      full:
        description: "Ausgewählte Einträge neu laden"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: fx-data
  cancel-in-progress: false

env:
  RELEASE_TAG: fx-data

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release anlegen und offene Einträge planen
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOLS: ${{ inputs.symbols }}
          TFS: ${{ inputs.tfs || 'h1,m1' }}
          # Vorübergehend nur 2013–2026: 2003–2012 lädt der Nutzer vom eigenen
          # PC (keine GitHub-Drosselung). Danach den Standard wieder entfernen.
          YEARS: ${{ inputs.years || '2013-2026' }}
          FULL: ${{ inputs.full }}
        run: |
          pip install --quiet pandas pyarrow
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --latest=false \
              --title "FX-Daten (Dukascopy, Bid/Ask)" \
              --notes "M1- und H1-Kerzen mit Bid und Ask in UTC, eine Parquet-Datei je Symbol, Zeitrahmen und Jahr (<SYMBOL>_<JAHR>_<tf>.parquet). Erzeugt von .github/workflows/fx-data.yml."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" \
            --jq '.[] | [.name, .updated_at, (.size | tostring)] | @tsv' > assets.tsv
          args=(--plan --assets assets.tsv --jobs 4 --symbols "$SYMBOLS" --tfs "$TFS" --years "$YEARS")
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python3 scripts/fx_fetch.py "${args[@]}" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install --quiet pandas pyarrow
      - name: Job ${{ matrix.job.id }} laden und hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          ITEMS: ${{ matrix.job.items }}
        run: |
          echo "$ITEMS" | tr ',' '\n'
          python3 scripts/fx_fetch.py --items "$ITEMS" --budget-min 320 --upload "$RELEASE_TAG"

  # GitHub lässt stündliche Zeitpläne oft ausfallen (21./22.10.: bis zu 3 h
  # Pause zwischen Läufen). Deshalb stößt ein erfolgreicher Lauf mit offenen
  # Einträgen den nächsten selbst an; er wartet, bis dieser Lauf zu Ende ist.
  next:
    needs: [plan, fetch]
    if: needs.plan.outputs.count != '0' && needs.fetch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Nächsten Lauf anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOLS: ${{ inputs.symbols }}
          TFS: ${{ inputs.tfs || 'h1,m1' }}
          YEARS: ${{ inputs.years }}
        run: |
          gh workflow run fx-data.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f symbols="$SYMBOLS" -f tfs="$TFS" -f years="$YEARS" -f full=false
